<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO GMP Formatter</title>
<style>
  :root {
    --bg: #f5f7f6; --surface: #ffffff; --ink: #14201b; --muted: #66746d;
    --line: #dde4e0; --accent: #0f7a55; --accent-ink: #ffffff; --accent-soft: #e3f3ec;
    --code-bg: #f0f4f2; --err: #c2382f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1512; --surface: #151d19; --ink: #e7efeb; --muted: #8fa198;
      --line: #263029; --accent: #3ecf98; --accent-ink: #06231a; --accent-soft: #163227;
      --code-bg: #0e1512; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 60px;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 0; color: var(--muted); max-width: 60ch; }

  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px;
  }
  .panel + .panel { margin-top: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .hint { color: var(--muted); font-size: 13px; }

  textarea {
    width: 100%; min-height: 240px; resize: vertical;
    background: var(--code-bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font: 13.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
  .chip span {
    display: inline-block; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--code-bg);
    font-size: 14px; font-weight: 600; color: var(--muted);
    transition: all .15s;
  }
  .chip input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chip input:focus-visible + span { box-shadow: 0 0 0 3px var(--accent-soft); outline: 2px solid var(--accent); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
  button {
    font: inherit; font-weight: 650; font-size: 14px; cursor: pointer;
    border-radius: 10px; padding: 10px 18px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); transition: transform .1s, background .15s;
  }
  button:hover { background: var(--code-bg); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }

  #status { margin-top: 14px; font-size: 13.5px; min-height: 20px; color: var(--muted); }
  .ok { color: var(--accent); font-weight: 600; }
  .error { color: var(--err); font-weight: 600; }

  pre {
    margin: 0; min-height: 160px; max-height: 480px; overflow: auto; white-space: pre-wrap;
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; font: 15px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  pre.empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IPO GMP Formatter</h1>
    <p class="sub">Paste your IPO JSON, choose which stages to keep, and get a clean SYMBOL, GMP list.</p>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>IPO JSON</h2>
      <span class="hint">Accepts {"data":[...]} or a plain array</span>
    </div>
    <textarea id="json" spellcheck="false" placeholder='{"data":[{"symbol":"ADROITIND","stage":"OPEN","gmp":37}]}'></textarea>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Stages to include</h2></div>
    <div class="chips">
      <label class="chip"><input type="checkbox" value="UPCOMING" checked><span>Upcoming</span></label>
      <label class="chip"><input type="checkbox" value="OPEN" checked><span>Open</span></label>
      <label class="chip"><input type="checkbox" value="CLOSED" checked><span>Closed</span></label>
      <label class="chip"><input type="checkbox" value="ALLOTTED" checked><span>Allotted</span></label>
    </div>
    <div class="actions">
      <button class="primary" onclick="formatGmp()">Generate</button>
      <button onclick="copyOutput()">Copy output</button>
      <button onclick="downloadOutput()">Download .txt</button>
      <button onclick="clearAll()">Clear</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Output</h2></div>
    <pre id="output" class="empty">Your formatted result will appear here.</pre>
  </section>
</div>

<script>
const PLACEHOLDER = "Your formatted result will appear here.";
const $ = id => document.getElementById(id);

function getRows(json) {
  const parsed = JSON.parse(json);
  if (Array.isArray(parsed)) return parsed;
  if (parsed && Array.isArray(parsed.data)) return parsed.data;
  throw new Error('Could not find an IPO array. Expected {"data":[...]} or [...]');
}

const clean = v => String(v ?? "").trim().toUpperCase();

function setOutput(text, empty) {
  $("output").textContent = text;
  $("output").classList.toggle("empty", !!empty);
}

function formatGmp() {
  const status = $("status");
  try {
    const rows = getRows($("json").value.trim());
    const stages = new Set(
      [...document.querySelectorAll('input[type="checkbox"]:checked')].map(x => x.value)
    );
    const result = [];
    for (const row of rows) {
      const symbol = clean(row.symbol);
      if (!symbol || !stages.has(clean(row.stage))) continue;
      let gmp = row.gmp;
      if (gmp === null || gmp === undefined || gmp === "") gmp = 0;
      result.push(`${symbol}, ${gmp}`);
    }
    if (result.length) {
      setOutput(result.join("\n"), false);
      status.innerHTML = `<span class="ok">${result.length} rows generated</span>`;
    } else {
      setOutput("No matching records.", true);
      status.textContent = "Try selecting more stages.";
    }
  } catch (e) {
    setOutput(PLACEHOLDER, true);
    status.innerHTML = `<span class="error">${e.message}</span>`;
  }
}

function hasOutput() {
  const t = $("output").textContent;
  return t && !$("output").classList.contains("empty");
}

async function copyOutput() {
  if (!hasOutput()) return;
  const text = $("output").textContent;
  let done = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      done = true;
    }
  } catch (e) { /* fall through to legacy copy */ }
  if (!done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    try { done = document.execCommand("copy"); } catch (e) { done = false; }
    document.body.removeChild(ta);
  }
  if (!done) {
    const range = document.createRange();
    range.selectNodeContents($("output"));
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  $("status").innerHTML = done
    ? '<span class="ok">Copied to clipboard</span>'
    : '<span class="error">Copy was blocked by the browser. The output is selected, press Ctrl+C (or Cmd+C) to copy.</span>';
}

function downloadOutput() {
  if (!hasOutput()) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("output").textContent], { type: "text/plain" }));
  a.download = "bulk-gmp.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearAll() {
  $("json").value = "";
  setOutput(PLACEHOLDER, true);
  $("status").textContent = "";
}
</script>
</body>
</html>
